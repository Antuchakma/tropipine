name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install server deps
        run: |
          cd tropipine-server
          npm ci
      - name: Syntax check server
        run: |
          cd tropipine-server
          npm run test
      - name: Generate Prisma client
        run: |
          cd tropipine-server
          npx prisma generate
